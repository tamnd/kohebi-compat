name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so that a CPython point release breaking us shows up within a day.
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv pip install --system -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  harness:
    name: Harness tests, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is current stable; 3.15 is in release candidate. The oracle
        # tracks stable, but the suite has to keep working on the next one.
        python: ["3.12", "3.13", "3.14", "3.15-dev"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests -q

  # The suite must pass when CPython is compared against itself. If this ever
  # fails, the harness is non-deterministic and every other result is suspect.
  self-consistency:
    name: Oracle self-consistency
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - run: kohebi-compat run suites --against cpython

  # The frontend can be checked long before anything can be run, by comparing
  # it against CPython over the standard library of the runner. A few thousand
  # files of real Python, none of which anyone here wrote, and it has already
  # found bugs the hand written suite did not.
  #
  # Two stages, in one job on purpose. The lexer is compared against the
  # `tokenize` module and the parser against `ast.dump`, and both need the same
  # kohebi binary, which is the slow part of this job by a wide margin. Running
  # them separately would build it twice on every matrix entry to save nothing.
  frontend:
    name: Frontend agreement, Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/kohebi
          path: .kohebi
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: .kohebi
      - run: cargo build --release --locked --bin kohebi
        working-directory: .kohebi
      - run: python -m pip install -e .
      - name: Tokens, hand written corpus
        # Small, deliberate, and every file has to match. Real code does not
        # use tabs for indentation or put a form feed in a class body, so a
        # corpus of real code exercises the easy half of a tokenizer only.
        run: >
          kohebi-compat tokens corpus/local
          --kohebi .kohebi/target/release/kohebi
      - name: Trees, hand written corpus
        # 3.12 is not asked. Its `ast.dump` prints optional empty lists that
        # 3.13 leaves out, which is a change to the printer rather than to the
        # tree, and kohebi implements the 3.13 one. The tokenizer comparison
        # still runs on 3.12 because nothing about it changed.
        if: matrix.python != '3.12'
        run: >
          kohebi-compat trees corpus/local
          --kohebi .kohebi/target/release/kohebi
      - name: Tokens, standard library of CPython ${{ matrix.python }}
        # No floor on agreement here. Agreement counts files we cannot handle
        # at all against us, a floor would have to be moved by hand on every
        # change, and what this fails on is a wrong answer, which is the thing
        # that matters.
        run: >
          kohebi-compat tokens
          --kohebi .kohebi/target/release/kohebi
          --out results/tokens-${{ matrix.python }}
          --quiet
      - name: Trees, standard library of CPython ${{ matrix.python }}
        # Runs even when the tokens step failed. The two stages fail for
        # different reasons and seeing only the first one costs a round trip.
        if: always() && matrix.python != '3.12'
        run: >
          kohebi-compat trees
          --kohebi .kohebi/target/release/kohebi
          --out results/trees-${{ matrix.python }}
          --quiet
      - name: Summarise
        if: always()
        run: |
          cat results/tokens-${{ matrix.python }}/tokens.md >> "$GITHUB_STEP_SUMMARY" || true
          cat results/trees-${{ matrix.python }}/trees.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: frontend-${{ matrix.python }}
          path: results/
          if-no-files-found: warn

  # PyPy and GraalPy disagree with CPython on purpose, so this job passes
  # --tolerate-mismatch and records the rate instead of failing on it. What it
  # does still fail on is a run that never happened, meaning the runtime did
  # not install or the oracle could not execute a case. That is the difference
  # between a measurement and an empty green tick.
  alternatives:
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Each alternative is compared against the CPython version it targets,
        # not against current stable. PyPy 7.3.23 implements 3.11, and running
        # it against a 3.14 oracle mostly measures three releases of error
        # message rewording, which says nothing about PyPy.
        include:
          - runtime: pypy
            setup: "pypy3.11"
            oracle: "3.11"
          # 25.2 rather than the current 25.3. GraalPy tagged that release
          # graal-25.3.4.1, and setup-python parses the tag into a version and
          # asks semver whether it satisfies the request. A four component
          # version is not valid semver, so nothing matches and the job fails
          # with "GraalPy version 25.3 with arch x64 not found". 25.2.4 is the
          # newest release setup-python can actually resolve, and it targets
          # Python 3.12.
          - runtime: graalpy
            setup: "graalpy-25.2"
            oracle: "3.12"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the oracle, CPython ${{ matrix.oracle }}
        id: oracle
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.oracle }}
      - name: Install ${{ matrix.runtime }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.setup }}
      - run: ${{ steps.oracle.outputs.python-path }} -m pip install -e .
      - name: Compare ${{ matrix.runtime }} against the oracle
        # The oracle is named by path rather than left to PATH resolution.
        # setup-python puts the most recently installed interpreter first, so
        # `python3` here is the alternative runtime, and the suite would
        # quietly be comparing PyPy against itself.
        run: >
          ${{ steps.oracle.outputs.python-path }} -m kohebi_compat run suites
          --against ${{ matrix.runtime }}
          --oracle-python ${{ steps.oracle.outputs.python-path }}
          --tolerate-mismatch
          --out results/${{ matrix.runtime }}
      - name: Summarise
        if: always()
        run: cat results/${{ matrix.runtime }}/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: results-${{ matrix.runtime }}
          path: results/${{ matrix.runtime }}
          if-no-files-found: warn

  compat-ok:
    name: Compatibility
    if: always()
    needs: [lint, harness, self-consistency, frontend]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required checks passed."
