[project]
name = "kohebi-compat"
version = "0.0.0"
description = "CPython compatibility suite for the kohebi Python runtime"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "tamnd" }]
keywords = ["python", "compatibility", "cpython", "testing", "kohebi"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
# The runner deliberately has no runtime dependencies. It has to be able to run
# under CPython, PyPy, GraalPy, and kohebi itself, and every dependency is one
# more thing that can fail to install on one of them.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    "mypy>=2.3",
]

[project.urls]
Homepage = "https://github.com/tamnd/kohebi-compat"
Runtime = "https://github.com/tamnd/kohebi"
Benchmarks = "https://github.com/tamnd/kohebi-bench"

[project.scripts]
kohebi-compat = "kohebi_compat.__main__:main"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kohebi_compat"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# suites/ is test data, not library code. Its exact source shape is deliberate,
# since several cases exist precisely to probe formatting-adjacent behaviour,
# so neither the linter nor the formatter should touch it.
extend-exclude = ["suites"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.mypy]
python_version = "3.11"
# Pinned so that a check passing locally passes in CI. Without this, mypy
# follows the host platform and platform-specific code type checks
# differently on macOS and on Linux.
platform = "linux"
strict = true
files = ["src"]
